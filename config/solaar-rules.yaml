%YAML 1.3
---
# workstation-mx-anywhere-desktops
# MX Anywhere 2 exposes these controls when they are set to "Key/Button
# Diversion” in Solaar.  The release action keeps browser Back/Forward from
# firing and sends KDE's default virtual-desktop shortcuts instead.
- Rule:
  - Key: [Back Button, released]
  - KeyPress: [Control_L, Super_L, Left]
- Rule:
  - Key: [Forward Button, released]
  - KeyPress: [Control_L, Super_L, Right]
